<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Puter AI en GitHub Pages</title>
</head>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        // Usamos acentos graves ` para evitar que las comillas internas rompan el código
        puter.ai.chat(
            `Review this code and refactor it into a production-ready Express middleware with proper error handling, input validation, and TypeScript types:\n\napp.post('/users', (req, res) => { db.query('INSERT INTO users SET ?', req.body, (err, result) => { res.json(result) }) })`,
            { model: "minimax/minimax-m2.5" }
        )
        .then(response => {
            puter.print(response, {code: true});
        })
        .catch(error => {
            document.body.innerHTML += `<p style="color:red">Error: ${error.message || error}</p>`;
        });
    </script>
</body>
</html>
